name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner

      - name: Verify original signature artifacts
        run: |
          test -f original/META-INF/MANIFEST.MF
          test -f original/META-INF/PLATFORM.SF
          test -f original/META-INF/PLATFORM.RSA
          mkdir -p build/original-signature
          cp -a original/META-INF/MANIFEST.MF original/META-INF/PLATFORM.SF original/META-INF/PLATFORM.RSA build/original-signature/

      - name: Generate apktool.yml compatibility file
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('apktool.json').read_text())

          def emit_scalar(value):
              if value is None:
                  return 'null'
              if isinstance(value, bool):
                  return 'true' if value else 'false'
              return "'" + str(value).replace("'", "''") + "'"

          lines = [
              'version: 2.7.0',
              f"apkFileName: {emit_scalar(data.get('apkFileName', 'base.apk'))}",
              f"isFrameworkApk: {emit_scalar(data.get('isFrameworkApk', False))}",
              'usesFramework:',
              '  ids:',
          ]
          for framework_id in data.get('UsesFramework', {}).get('ids', [1]):
              lines.append(f'  - {framework_id}')
          lines.extend([
              f"  tag: {emit_scalar(data.get('UsesFramework', {}).get('tag'))}",
              'sdkInfo:',
          ])
          for key, value in data.get('sdkInfo', {}).items():
              lines.append(f"  {key}: {emit_scalar(value)}")
          lines.extend([
              'packageInfo:',
              f"  forcedPackageId: {emit_scalar(data.get('PackageInfo', {}).get('forcedPackageId'))}",
              f"  renameManifestPackage: {emit_scalar(data.get('PackageInfo', {}).get('renameManifestPackage'))}",
              'versionInfo:',
              f"  versionCode: {emit_scalar(data.get('VersionInfo', {}).get('versionCode'))}",
              f"  versionName: {emit_scalar(data.get('VersionInfo', {}).get('versionName'))}",
              f"resourcesAreCompressed: {emit_scalar(data.get('compressionType', False))}",
              f"sharedLibrary: {emit_scalar(data.get('sharedLibrary', False))}",
              'unknownFiles:',
          ])
          for name, mode in data.get('unknownFiles', {}).items():
              lines.append(f"  {name}: {emit_scalar(mode)}")
          lines.append('doNotCompress:')
          for item in data.get('doNotCompress', []):
              lines.append(f"- {emit_scalar(item)}")
          Path('apktool.yml').write_text('\n'.join(lines) + '\n')
          PY

      - name: Build unsigned APK from decompiled sources
        run: apktool b . -o build/GameBoos-debug-unsigned.apk

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -keystore build/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign debug APK
        run: |
          apksigner sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/GameBoos-debug.apk \
            build/GameBoos-debug-unsigned.apk
          apksigner verify --verbose build/GameBoos-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairOverlay-debug-apk
          path: build/GameBoos-debug.apk

      - name: Upload original signature reference
        uses: actions/upload-artifact@v4
        with:
          name: original-samsung-signature-reference
          path: build/original-signature/
