name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool apksigner

      - name: Verify original signature artifacts
        run: |
          test -f original/META-INF/MANIFEST.MF
          test -f original/META-INF/PLATFORM.SF
          test -f original/META-INF/PLATFORM.RSA
          mkdir -p build/original-signature
          cp -a original/META-INF/MANIFEST.MF original/META-INF/PLATFORM.SF original/META-INF/PLATFORM.RSA build/original-signature/

      - name: Build unsigned APK from decompiled sources
        run: apktool b . -o build/GameBoos-debug-unsigned.apk

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -keystore build/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign debug APK
        run: |
          apksigner sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/GameBoos-debug.apk \
            build/GameBoos-debug-unsigned.apk
          apksigner verify --verbose build/GameBoos-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CrosshairOverlay-debug-apk
          path: build/GameBoos-debug.apk

      - name: Upload original signature reference
        uses: actions/upload-artifact@v4
        with:
          name: original-samsung-signature-reference
          path: build/original-signature/
