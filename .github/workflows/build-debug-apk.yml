       - name: Generate apktool.yml compatibility file
         run: |
           python3 - <<'PY'
           import json
           from pathlib import Path
 
           data = json.loads(Path('apktool.json').read_text())
 
           def emit_scalar(value):
               if value is None:
                   return 'null'
               if isinstance(value, bool):
                   return 'true' if value else 'false'
               return "'" + str(value).replace("'", "''") + "'"
 
           lines = [
               'version: 3.0.3',
               f"apkFileName: {emit_scalar(data.get('apkFileName', 'base.apk'))}",
               f"isFrameworkApk: {emit_scalar(data.get('isFrameworkApk', False))}",
               'usesFramework:',
               '  ids:',
           ]
           for framework_id in data.get('UsesFramework', {}).get('ids', [1]):
               lines.append(f'  - {framework_id}')
           lines.extend([
               f"  tag: {emit_scalar(data.get('UsesFramework', {}).get('tag'))}",
               'sdkInfo:',
           ])
           for key, value in data.get('sdkInfo', {}).items():
               lines.append(f"  {key}: {emit_scalar(value)}")
+          def emit_integer(value):
+              if value is None:
+                  return 'null'
